spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:TutorBookingDb}?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change-me}
app.jwt.secret=${JWT_SECRET:replace-with-generated-base64-secret}
spring.security.oauth2.client.registration.google.client-id=${CLIENT_ID:local-placeholder}
spring.security.oauth2.client.registration.google.client-secret=${SECRET_ID:local-placeholder}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.ai.openai.api-key=${GEMINI_API_KEY:}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
frontend.url=${FRONTEND_URL:http://localhost:3000}
